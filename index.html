        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .wrapper {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        /* الهيدر العصري */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(145deg, #131c2e, #0f172a);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f59e0b, #3b82f6);
        }

        .logo-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            color: var(--primary);
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* شبكة الخدمات */
        .services-container {
            display: grid;
            gap: 16px;
            margin-bottom: 35px;
        }

            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s ease;
        }

        .service-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

            flex-shrink: 0;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
